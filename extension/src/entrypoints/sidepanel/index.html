<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Shaghal</title>
    <style>
      /* System-mode page colour until theme.css loads, so neither mode flashes.
         color-scheme is set on the root only. A pinned theme overrides it there
         through data-theme, and body must inherit that. */
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: light-dark(#f3f3f3, #0e0e10);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
